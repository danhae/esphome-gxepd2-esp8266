esphome:
  name: epaper-bilderrahmen
  friendly_name: E-Paper Bilderrahmen
  min_version: 2026.9.1
  platformio_options:
    lib_ldf_mode: chain+

esp8266:
  board: nodemcuv2
  framework:
    version: recommended

logger:
  level: WARN
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

external_components:
  - source:
      type: git
      url: https://github.com/danhae/esphome-gxepd2-esp8266
      ref: v1.1.0-beta.2
      path: components
    components: [gxepd2_frame]

http_request:
  id: epaper_http
  timeout: 5s
  follow_redirects: false
  verify_ssl: false
  esp8266_disable_ssl_support: true

gxepd2_frame:
  id: epaper_frame
  http_request_id: epaper_http

text:
  - platform: template
    name: E-Paper Bild-URL
    id: epaper_image_url
    mode: text
    optimistic: true
    restore_value: true
    max_length: 255

button:
  - platform: template
    name: E-Paper Bild aktualisieren
    id: epaper_bild_aktualisieren
    on_press:
      - lambda: |-
          id(epaper_frame).request_image_url(id(epaper_image_url).state);
  - platform: template
    name: E-Paper Testbild anzeigen
    id: epaper_testbild_anzeigen
    on_press:
      - lambda: |-
          id(epaper_frame).request_test_image();

debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: E-Paper Freier Heap
      id: epaper_freier_heap

binary_sensor:
  - platform: template
    name: E-Paper Rendering
    id: epaper_rendering
    entity_category: diagnostic
    lambda: |-
      return id(epaper_frame).is_rendering();
