esphome:
  name: epaper-bilderrahmen
  friendly_name: E-Paper Bilderrahmen
  min_version: 2026.9.1
  platformio_options:
    lib_ldf_mode: chain+

esp8266:
  board: nodemcuv2
  framework:
    version: recommended

logger:
  level: WARN
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

external_components:
  - source:
      type: git
      url: https://github.com/danhae/esphome-gxepd2-esp8266
      ref: v1.0.0
      path: components
    components: [gxepd2_frame]

gxepd2_frame:
  id: epaper_frame

button:
  - platform: template
    name: E-Paper Testbild anzeigen
    id: epaper_testbild_anzeigen
    on_press:
      - lambda: |-
          id(epaper_frame).request_test_image();

debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: E-Paper Freier Heap
      id: epaper_freier_heap
