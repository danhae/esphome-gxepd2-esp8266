name: ESP8266 source and image validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ESPHome 2026.9.1
        run: python -m pip install -r requirements.txt
      - name: Validate YAML and generate source (no firmware compilation)
        run: python scripts/ci_build.py
      - name: Test image conversion
        run: python -m unittest discover -s tests -v
      - name: Test component streaming with host mocks
        run: python scripts/test_stream.py

  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install Home Assistant schema validator
        run: python -m pip install homeassistant==2026.10.1
      - name: Validate test blueprint
        run: python scripts/validate_blueprint.py
